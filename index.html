<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA: vite-plugin-pwa injects the manifest link + SW registration
         automatically at build time (see vite.config.ts). These extra tags
         cover what the manifest alone doesn't: Safari/iOS doesn't read
         start_url/display from the manifest for "Add to Home Screen", and
         theme-color needs to be in the document head directly. -->
    <meta name="theme-color" content="#1A1712" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ChatSched" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- chatsched.com is the real domain (info@chatsched.com is the real
         contact address too) — nothing here needs swapping before going
         live. -->
    <link rel="canonical" href="https://chatsched.com/" />

    <title>ChatSched — Managed Advertising, Marketplace & Publisher Network</title>
    <meta name="description" content="Tell ChatSched your goal and a campaign manager builds it for you, or browse and book South African publishers and creators directly yourself — social media, influencer, website, podcast and radio." />

    <!-- Open Graph / social previews. og-image.png now exists at
         /public/og-image.png (generated by scripts/generate_og_image.py —
         swap for a properly designed version whenever there's time). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ChatSched" />
    <meta property="og:title" content="ChatSched — Managed Advertising, Marketplace & Publisher Network" />
    <meta property="og:description" content="ChatSched plans and runs your advertising across publishers, creators and channels South African audiences already trust — or browse the marketplace and book it yourself." />
    <meta property="og:url" content="https://chatsched.com/" />
    <meta property="og:locale" content="en_ZA" />
    <meta property="og:image" content="https://chatsched.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ChatSched — Managed Advertising, Marketplace & Publisher Network" />
    <meta name="twitter:description" content="Tell ChatSched your goal and a campaign manager builds it for you, or browse and book South African publishers and creators directly yourself." />
    <meta name="twitter:image" content="https://chatsched.com/og-image.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "ChatSched",
        "url": "https://chatsched.com/",
        "email": "info@chatsched.com",
        "telephone": "+27 60 897 3472",
        "description": "ChatSched is South Africa's managed advertising platform: a done-for-you campaign agency, a self-service marketplace, and a publisher network spanning social media, influencer, website, podcast and radio channels.",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "West Way Farmstay Accommodation, R27",
          "addressLocality": "Langebaan",
          "postalCode": "7357",
          "addressCountry": "ZA"
        },
        "areaServed": {
          "@type": "Country",
          "name": "South Africa"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
